name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create web assets directory
      run: |
        mkdir -p www
        # Procura o index.html em qualquer lugar e copia para www/
        find . -name "index.html" -exec cp {} www/ \;
        # Se não achou, cria um index.html padrão com seu jogo
        if [ ! -f www/index.html ]; then
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CraftHomem3D</title><style>body{margin:0;overflow:hidden;background:#87CEEB;}</style></head><body>Arquivo HTML não encontrado. Coloque seu jogo aqui.</body></html>' > www/index.html
        fi
    
    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
    
    - name: Initialize Capacitor
      run: npx cap init CraftHomem3D com.crafthomem.game --web-dir=www
    
    - name: Add Android platform
      run: npx cap add android
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/*.apk
